    <rect width="1280" height="380" fill="url(#grid)"/>
    <ellipse cx="1070" cy="170" rx="420" ry="340" fill="url(#glow)"/>
    <rect width="1280" height="4" fill="url(#accent)"/>
    <path d="M0 352 C280 302 540 406 840 349 S1100 305 1280 329" fill="none" stroke="url(#accent)" stroke-width="1" opacity=".24"/>
