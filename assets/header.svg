      <path d="M13 0 H409 Q422 0 422 13 V37 H0 V13 Q0 0 13 0" fill="#172033"/>
      <circle cx="20" cy="19" r="4.5" fill="#FB7185"/><circle cx="36" cy="19" r="4.5" fill="#FBBF24"/><circle cx="52" cy="19" r="4.5" fill="#34D399"/>
      <text x="82" y="23" font-family="Consolas, monospace" font-size="12" fill="#94A3B8">shlok@dev: ~/workspace</text>
