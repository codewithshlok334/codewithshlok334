<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Shlok Maurya | Developer workspace</title>
  <desc id="desc">Full-stack web development and applied AI. Building useful ideas into working projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090F1D"/><stop offset="1" stop-color="#17132E"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#22D3EE"/><stop offset="0.5" stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7C3AED" stop-opacity=".23"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A5B4FC" stroke-opacity=".055"/></pattern>
    <clipPath id="clip"><rect width="1280" height="380" rx="20"/></clipPath>
  </defs>
  <style>
    .cursor { animation: breathe 2s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <g clip-path="url(#clip)">
