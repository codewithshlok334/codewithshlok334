      <rect x="48" y="40" width="272" height="32" rx="16" fill="#14313E" stroke="#22D3EE" stroke-opacity=".24"/>
      <circle cx="66" cy="56" r="4" fill="#34D399"/>
      <text x="80" y="61" fill="#A5F3FC" font-size="12" font-weight="600" letter-spacing="1.6">WELCOME TO MY WORKSPACE</text>
      <text x="46" y="152" fill="#F8FAFC" font-size="72" font-weight="750" letter-spacing="-3">Shlok Maurya<tspan fill="#22D3EE">.</tspan></text>
      <text x="50" y="199" fill="url(#accent)" font-size="25" font-weight="600">Full-stack web development · Applied AI</text>
      <text x="50" y="242" fill="#A5B4CF" font-size="20">Building useful ideas into working projects.</text>
      <text x="50" y="313" fill="#64748B" font-size="14" letter-spacing="1">PYTHON / JAVA / JAVASCRIPT / TYPESCRIPT</text>
