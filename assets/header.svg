        <text x="22" y="76" fill="#22D3EE">$ <tspan fill="#E2E8F0">whoami</tspan></text>
        <text x="22" y="107" fill="#C4B5FD">@codewithshlok334</text>
        <text x="22" y="146" fill="#22D3EE">$ <tspan fill="#E2E8F0">cat mindset.txt</tspan></text>
